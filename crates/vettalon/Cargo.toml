[package]
name = "vettalon"
description = "Multi-model security audit: OSS scanners + AI audit with cross-family adversarial review"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Exposes `audit::fuzzing` (doc-hidden re-exports of private parsers) for the
# cargo-fuzz targets in the repository's `fuzz/` directory. Not for normal use.
fuzzing = []

[[bin]]
name = "vettalon"
path = "src/main.rs"

[dependencies]
vettalon-contract = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
futures = "0.3"
hex = "0.4"
tar = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1.1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
unicode-normalization = "0.1"
unicode-script = "0.5"
unicode-segmentation = "1.12"

[dev-dependencies]
yaml-rust2 = { version = "0.13", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "job-object", "kill-on-drop"] }
