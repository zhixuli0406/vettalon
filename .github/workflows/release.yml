name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: read

jobs:
  build:
    # Only the public repo cuts releases; the private mirror never publishes.
    if: github.repository == 'zhixuli0406/vettalon'
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write   # cosign keyless (Sigstore OIDC) signing
      attestations: write # GitHub build provenance for exact archive/BOM digests
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: vettalon-darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: vettalon-darwin-x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            artifact: vettalon-linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            artifact: vettalon-linux-arm64
    steps:
      - name: Validate tag
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad tag $TAG"; exit 1; }
          [[ "$WORKFLOW_REF" == "refs/tags/$TAG" ]] || { echo "dispatch the workflow using the release tag ref (not a branch)"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          targets: ${{ matrix.target }}
      - name: Install cross (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --locked
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cross build --locked --release -p vettalon --target ${{ matrix.target }}
          else
            cargo build --locked --release -p vettalon --target ${{ matrix.target }}
          fi
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.2
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir _pkg
          cp target/${{ matrix.target }}/release/vettalon _pkg/
          cp README.md LICENSE NOTICE _pkg/
          tar czf ${{ matrix.artifact }}.tar.gz -C _pkg .
          shasum -a 256 ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256
          cosign sign-blob --yes --new-bundle-format \
            --output-signature ${{ matrix.artifact }}.tar.gz.sig \
            --output-certificate ${{ matrix.artifact }}.tar.gz.pem \
            --bundle ${{ matrix.artifact }}.tar.gz.sigstore.json \
            ${{ matrix.artifact }}.tar.gz

      - name: Install trust tools (pinned official Syft checksum)
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/trust-venv"
          "$RUNNER_TEMP/trust-venv/bin/python" -m pip install --require-hashes -r scripts/trust/requirements.txt
          python3 scripts/trust/install-syft.py "$RUNNER_TEMP/syft"
      - name: Generate source-lock SBOM and unsigned build record
        shell: bash
        run: |
          "$RUNNER_TEMP/trust-venv/bin/python" scripts/trust/trust.py release-sbom . \
            ${{ matrix.artifact }}.tar.gz --output ${{ matrix.artifact }}.tar.gz.cdx.json \
            --source-sha "$(git rev-parse HEAD)" --target ${{ matrix.target }} --syft "$RUNNER_TEMP/syft"
      - name: Attest archive and SBOM build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.cdx.json
      - name: Require every release sidecar and matching digest
        run: '"$RUNNER_TEMP/trust-venv/bin/python" scripts/trust/trust.py verify-assets ${{ matrix.artifact }}.tar.gz'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            vettalon-*.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trust-source
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Validate merged assets before publication
        run: |
          python3 -m venv "$RUNNER_TEMP/trust-venv"
          "$RUNNER_TEMP/trust-venv/bin/python" -m pip install --require-hashes -r trust-source/scripts/trust/requirements.txt
          count=0
          for asset in vettalon-*.tar.gz; do
            "$RUNNER_TEMP/trust-venv/bin/python" trust-source/scripts/trust/trust.py verify-assets "$asset"
            count=$((count + 1))
          done
          test "$count" -eq 4
      # minisign is optional: sign only if the keypair secret is configured
      # (reuses the DuDuClaw signing setup). cosign signatures ship regardless.
      - name: Sign with minisign (optional)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          [ -z "$MINISIGN_SECRET_KEY" ] && { echo "no MINISIGN_SECRET_KEY, skipping"; exit 0; }
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          umask 077; printf '%s\n' "$MINISIGN_SECRET_KEY" > /tmp/mk.key
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          for f in vettalon-*.tar.gz vettalon-*.zip; do
            [ -f "$f" ] && minisign -S -s /tmp/mk.key -m "$f" -t "vettalon $TAG $f" -x "$f.minisig"
          done
          rm -f /tmp/mk.key
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            vettalon-*.tar.gz
            vettalon-*.sha256
            vettalon-*.sig
            vettalon-*.pem
            vettalon-*.minisig
            vettalon-*.cdx.json
            vettalon-*.build-record.json
            vettalon-*.sigstore.json

  npm-publish:
    needs: release
    if: github.repository == 'zhixuli0406/vettalon'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # npm trusted publishing: the job's OIDC token is exchanged for a
      # short-lived publish credential. No long-lived NPM_TOKEN is used.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 bundles npm 11; trusted publishing needs npm >= 11.5.1.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Require an npm that supports trusted publishing
        run: |
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);if(a<11||(a===11&&(b<5||(b===5&&c<1)))){console.error("npm "+process.argv[1]+" < 11.5.1");process.exit(1)}' "$(npm --version)"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: artifacts
      # Stage only: the trusted publisher on npmjs.com allows `npm stage publish`
      # and nothing else. Each staged version goes live only after a maintainer
      # runs `npm stage approve <id>` with 2FA (see docs/TRUST.md).
      - name: Stage packages on npm
        env:
          ARTIFACTS_DIR: ./artifacts
          NPM_PUBLISH_MODE: stage
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          ./npm/scripts/publish.sh "${TAG#v}"
