# OpenSSF Scorecard for the public repository. Results are published to the
# Scorecard API (badge) and uploaded to code scanning. Runs only on the public
# repo; the private source of this file has no public Scorecard entry.
# publish_results forbids top-level env/defaults, workflow-level writes and
# `run` steps in this job.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '27 3 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    if: github.repository == 'zhixuli0406/vettalon'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Default GITHUB_TOKEN, as the action recommends. A separate read-only
      # token adds nothing while main uses rulesets or no classic protection.
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
