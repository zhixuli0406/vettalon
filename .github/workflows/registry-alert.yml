# Daily check that every npm version from 0.3.0 on has a matching GitHub
# release with its tag commit on main, a successful npm-publish job, and
# verified npm provenance naming that run (scripts/trust/registry_alert.py).
# Mismatches and check errors open or comment on separate alert issues. Runs
# only on the public repo; read-only apart from that issue. Uses GITHUB_TOKEN only.
name: Registry alert

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: npm versions match release runs
    if: github.repository == 'zhixuli0406/vettalon'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      status: ${{ steps.scan.outputs.status }}
      report: ${{ steps.scan.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned gh
        env:
          GH_VERSION: 2.103.3
          GH_SHA256: 4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d
        run: |
          archive="$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 \
            "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GH_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"
      - name: Prove gh accepts known-good and rejects tampered provenance
        env:
          VETTALON_GH_INTEGRATION: '1'
          VETTALON_GH_VERSION: 2.103.3
        run: python3 -B -I -S -m unittest discover -s scripts/trust/tests -p 'test_registry_alert_gh.py'
      - name: Compare registry versions with release runs
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 -I scripts/trust/registry_alert.py --repo "$GITHUB_REPOSITORY" --report "$RUNNER_TEMP/report.md"
          rc=$?
          set -e
          case "$rc" in 0) status=ok ;; 1) status=mismatch ;; *) status=error ;; esac
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ -f "$RUNNER_TEMP/report.md" ]; then
            cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
            delimiter="REPORT_$(openssl rand -hex 16)"
            { echo "report<<$delimiter"; cat "$RUNNER_TEMP/report.md"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"
          fi
      # A separate step fails the job, so the scan step's outputs are always set.
      - name: Fail unless every version matched
        env:
          STATUS: ${{ steps.scan.outputs.status }}
        run: |
          echo "registry alert status: $STATUS"
          [ "$STATUS" = ok ]

  issue:
    name: Open or update the alert issue
    needs: check
    if: always() && github.repository == 'zhixuli0406/vettalon' && needs.check.result != 'cancelled' && needs.check.result != 'skipped' && (needs.check.result != 'success' || needs.check.outputs.status != 'ok')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPORT: ${{ needs.check.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: ${{ needs.check.outputs.status == 'mismatch' && 'Registry version without a matching release run' || 'Registry alert could not check' }}
        run: |
          body="$RUNNER_TEMP/body.md"
          if [ -z "$REPORT" ]; then
            REPORT='The check did not finish. See the run linked above for details.'
          fi
          { printf 'Failed check: %s\n\n' "$RUN_URL"; printf '%s\n' "$REPORT"; } > "$body"
          number=$(gh issue list --state open --limit 500 --json number,title \
            --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$body"
          else
            gh issue create --title "$TITLE" --body-file "$body"
          fi
