name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The open-source core: scanning, multi-model review, SARIF, disclosure
  # drafts. The dashboard/report generator live in a separate private crate.
  CORE: -p vettalon -p vettalon-contract

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy ${{ env.CORE }} --all-targets -- -D warnings
      - run: cargo test ${{ env.CORE }}
      # The three Docker live tests (PoC sandbox flags, O2 oracle, O19 fix
      # check). No model calls, no secrets; the image is pinned by digest.
      - name: Docker PoC sandbox, oracle and fix-check live tests (no model calls)
        if: matrix.os == 'ubuntu-24.04'
        timeout-minutes: 10
        env:
          POC_IMAGE: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
          LIVE_TESTS: >-
            sandbox::tests::docker_sandbox_runs_python_offline_as_non_root
            audit::poc_oracle::tests::live_command_injection_oracle_is_differential_only_when_vulnerable
            audit::fix_check::tests::live_fix_check_verifies_a_real_fix_and_rejects_a_no_op
        run: |
          docker pull "$POC_IMAGE"
          docker tag "$POC_IMAGE" python:3.12-slim
          found=$(cargo test ${{ env.CORE }} --lib -- --ignored --list --exact $LIVE_TESTS | grep -c ': test$')
          test "$found" -eq 3 || { echo "expected 3 live Docker tests, found $found"; exit 1; }
          cargo test ${{ env.CORE }} --lib -- --ignored --exact $LIVE_TESTS --nocapture --test-threads=1
      - name: Set up Python for macOS query contracts
        if: matrix.os == 'macos-latest'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Query refinement public V2 offline contracts
        if: matrix.os == 'macos-latest'
        run: python -m unittest discover -s benchmarks/query-refinement -p 'test_*.py'

  trust:
    name: trust tools (no signing or publishing)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -m pip install --require-hashes -r scripts/trust/requirements.txt
      - run: python -m unittest discover -s scripts/trust/tests -p 'test_*.py'
      - run: python -B -I -S -m unittest discover -s reports/evidence-acceptance/cli-v020-public-trust-readback-20261019 -p 'test_*.py'
      - name: npm publish dry-run contract
        run: node --test npm/scripts/tests/publish-dry-run.test.mjs
      - run: bash -n scripts/trust/verify-release.sh scripts/trust/scorecard.sh npm/scripts/publish.sh
      - run: python -B -I -S -m unittest discover -s scripts/images -p 'test_*.py'

  scanner-windows:
    name: scanner process limits (Windows native)
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Record native toolchain and runner
        shell: pwsh
        run: |
          rustc -Vv
          if ($LASTEXITCODE -ne 0) { throw "rustc metadata failed: $LASTEXITCODE" }
          Write-Host "Runner OS: $env:RUNNER_OS / $env:RUNNER_ARCH"
      - name: Require Windows scanner test discovery
        shell: pwsh
        run: |
          $testList = @(cargo test --locked -p vettalon --lib audit::scanners::exec::windows::tests -- --list)
          $listExit = $LASTEXITCODE
          $testList | ForEach-Object { Write-Host $_ }
          if ($listExit -ne 0) { throw "Windows scanner test listing failed: $listExit" }
          $nativeTests = @($testList | Where-Object { $_ -match '^audit::scanners::exec::windows::tests::windows_[^ ]+: test$' })
          if ($nativeTests.Count -lt 2) { throw "Expected at least two Windows scanner tests; found $($nativeTests.Count)" }
      - name: Run Windows scanner tests serially
        shell: pwsh
        run: |
          cargo test --locked -p vettalon --lib audit::scanners::exec::windows::tests -- --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "Windows scanner tests failed: $LASTEXITCODE" }
      - name: Run Windows executable and owner-liveness boundary tests
        shell: pwsh
        run: |
          cargo test --locked -p vettalon --lib util::tests::windows_scan_tool_resolution_rejects_executables_inside_the_untrusted_root -- --exact --nocapture
          if ($LASTEXITCODE -ne 0) { throw "Windows executable-boundary test failed: $LASTEXITCODE" }
          cargo test --locked -p vettalon --lib llm::container::tests::windows_agent_owner_probe_distinguishes_live_and_absent_processes -- --exact --nocapture
          if ($LASTEXITCODE -ne 0) { throw "Windows owner-liveness test failed: $LASTEXITCODE" }
      - name: Run Windows disclosure path-containment tests
        shell: pwsh
        run: |
          cargo test --locked -p vettalon --lib disclose::tests::detects_project_locally -- --exact --nocapture
          if ($LASTEXITCODE -ne 0) { throw "Windows disclosure control failed: $LASTEXITCODE" }
          cargo test --locked -p vettalon --lib disclose::tests::project_detection_rejects_an_absolute_head_ref_outside_the_repo -- --exact --nocapture
          if ($LASTEXITCODE -ne 0) { throw "Windows disclosure containment test failed: $LASTEXITCODE" }

  fuzz:
    name: fuzz (cargo-fuzz, bounded run per target)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Dated nightly (cargo-fuzz needs -Zsanitizer); bump deliberately.
      FUZZ_TOOLCHAIN: nightly-2026-10-01
      FUZZ_SECONDS: '45'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: nightly-2026-10-01
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo +"$FUZZ_TOOLCHAIN" install cargo-fuzz --version 0.13.2 --locked
      - name: Build fuzz targets
        run: cargo +"$FUZZ_TOOLCHAIN" fuzz build
      - name: Run every target for a fixed time
        run: |
          for target in $(cargo +"$FUZZ_TOOLCHAIN" fuzz list); do
            echo "::group::fuzz $target"
            mkdir -p "fuzz/corpus/$target"
            cargo +"$FUZZ_TOOLCHAIN" fuzz run "$target" "fuzz/corpus/$target" "fuzz/seeds/$target" \
              -- -max_total_time="$FUZZ_SECONDS" -print_final_stats=1
            echo "::endgroup::"
          done
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
