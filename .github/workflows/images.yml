name: Container images

# Publishes the two images `vettalon agents pull` fetches: the grok-free
# agents base and the egress proxy, for linux/amd64 and linux/arm64, to
# ghcr.io/zhixuli0406/vettalon-{agents-base,egress}:<tag>, where <tag> is the
# definition hash the CLI itself computes (`vettalon agents images`).
# Each image is signed (keyless cosign, by digest), carries SLSA provenance
# and an SBOM, and has its corresponding source published next to it as
# <tag>-source (also an OCI referrer of the image). grok is proprietary and
# is never published; the CLI adds it locally.
#
# A tag is written once: an existing tag is reused only if this workflow
# signed it, and never overwritten. The image tag is set last, after its
# source artifact is published, so a failed run leaves nothing tagged.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: container-images
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/zhixuli0406
  # The same signer rule `vettalon agents pull` enforces.
  SIGNER_IDENTITY_REGEXP: ^https://github\.com/zhixuli0406/vettalon/\.github/workflows/images\.yml@refs/(heads/main|tags/v[0-9]+\.[0-9]+\.[0-9]+)$
  SIGNER_ISSUER: https://token.actions.githubusercontent.com

jobs:
  tags:
    # Only the public repo publishes, and only from main or a release tag
    # (the refs the signer rule accepts).
    if: github.repository == 'zhixuli0406/vettalon' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    outputs:
      agents-base: ${{ steps.tags.outputs.agents-base }}
      egress: ${{ steps.tags.outputs.egress }}
    steps:
      - name: Refuse refs the signer rule would not accept
        env:
          REF: ${{ github.ref }}
        run: |
          [[ "$REF" == refs/heads/main || "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad ref $REF"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
      - name: Expected tags, computed by the CLI itself
        id: tags
        run: |
          cargo build --locked -q -p vettalon
          mapfile -t tags < <(target/debug/vettalon agents images)
          printf '%s\n' "${tags[@]}"
          [[ ${#tags[@]} -eq 3 ]] || { echo "expected 3 tags"; exit 1; }
          [[ ${tags[1]} =~ ^vettalon-egress:[0-9a-f]{12}$ ]] || exit 1
          [[ ${tags[2]} =~ ^vettalon-agents-base:[0-9a-f]{12}$ ]] || exit 1
          echo "egress=${tags[1]#*:}" >> "$GITHUB_OUTPUT"
          echo "agents-base=${tags[2]#*:}" >> "$GITHUB_OUTPUT"

  publish:
    needs: tags
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write     # push to GHCR
      id-token: write     # keyless cosign and attestation signing
      attestations: write # GitHub build provenance
    strategy:
      fail-fast: false
      matrix:
        image: [agents-base, egress]
    env:
      IMAGE: ${{ matrix.image }}
      TAG: ${{ needs.tags.outputs[matrix.image] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # cosign v2.6.5: the same version release.yml signs with. The installer
      # verifies the binary against cosign's release key before use.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5
      # oras 1.3.4: the action checks the download against its pinned SHA-256.
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Existing tags (reused only if this workflow signed them)
        id: state
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[0-9a-f]{12}$ ]] || { echo "bad tag $TAG"; exit 1; }
          repo="$REGISTRY/vettalon-$IMAGE"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          # exists <ref>: prints the digest, or nothing when the tag is absent;
          # any other registry error fails the job.
          exists() {
            local out
            if out=$(oras manifest fetch --descriptor "$1" 2>&1); then
              jq -r .digest <<<"$out"
            elif grep -qiE 'not found|name unknown|manifest unknown' <<<"$out"; then
              :
            else
              echo "$out" >&2; return 1
            fi
          }
          digest=$(exists "$repo:$TAG")
          if [[ -n "$digest" ]]; then
            cosign verify --certificate-identity-regexp "$SIGNER_IDENTITY_REGEXP" \
              --certificate-oidc-issuer "$SIGNER_ISSUER" "$repo@$digest" > /dev/null \
              || { echo "::error::$repo:$TAG exists but this workflow did not sign it"; exit 1; }
            echo "$repo:$TAG already published as $digest; not rebuilding"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          src=$(exists "$repo:$TAG-source")
          if [[ -n "$src" ]]; then
            cosign verify --certificate-identity-regexp "$SIGNER_IDENTITY_REGEXP" \
              --certificate-oidc-issuer "$SIGNER_ISSUER" "$repo@$src" > /dev/null \
              || { echo "::error::$repo:$TAG-source exists but this workflow did not sign it"; exit 1; }
          fi
          if [[ -n "$digest" ]]; then
            echo "source=$src" >> "$GITHUB_OUTPUT"
          else
            # A source tag without an image tag is left over from a failed run
            # (its image was never tagged); this run replaces it.
            echo "stale_source=$src" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push by digest (untagged until its source is out)
        id: build
        if: steps.state.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ steps.state.outputs.repo }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/zhixuli0406/vettalon
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=vettalon ${{ matrix.image }} (definition ${{ env.TAG }}); source at :${{ env.TAG }}-source
          annotations: |
            index:org.opencontainers.image.source=https://github.com/zhixuli0406/vettalon
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.description=vettalon ${{ matrix.image }} (definition ${{ env.TAG }}); source at :${{ env.TAG }}-source

      - name: Sign the new image by digest
        id: signed
        if: steps.state.outputs.exists != 'true'
        env:
          REPO: ${{ steps.state.outputs.repo }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad digest $DIGEST"; exit 1; }
          cosign sign --yes "$REPO@$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: steps.state.outputs.exists != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.state.outputs.repo }}
          subject-digest: ${{ steps.signed.outputs.digest }}
          push-to-registry: true

      - name: Publish the corresponding source as <tag>-source
        env:
          REPO: ${{ steps.state.outputs.repo }}
          DIGEST: ${{ steps.signed.outputs.digest || steps.state.outputs.digest }}
          SOURCE: ${{ steps.state.outputs.source }}
          STALE_SOURCE: ${{ steps.state.outputs.stale_source }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad digest $DIGEST"; exit 1; }
          if [[ -n "$SOURCE" ]]; then
            cosign verify --certificate-identity-regexp "$SIGNER_IDENTITY_REGEXP" \
              --certificate-oidc-issuer "$SIGNER_ISSUER" "$REPO@$SOURCE" > /dev/null
            subject=$(oras manifest fetch "$REPO@$SOURCE" | jq -r '.subject.digest // empty')
            [[ "$subject" == "$DIGEST" ]] || { echo "::error::$TAG-source belongs to $subject, not $DIGEST"; exit 1; }
            echo "source already published as $SOURCE"
            exit 0
          fi
          out="$RUNNER_TEMP/sources"
          pkg="$RUNNER_TEMP/source-artifact"
          python3 -B -I scripts/images/collect_sources.py --image "$REPO@$DIGEST" --kind "$IMAGE" --out "$out"
          mkdir "$pkg"
          tar -C "$out" --sort=name --owner=0 --group=0 --numeric-owner -cf "$pkg/sources.tar" --exclude=./SOURCES.json .
          cp "$out/SOURCES.json" "$pkg/SOURCES.json"
          # oras only takes files under the working directory.
          cd "$pkg"
          oras attach --format json \
            --artifact-type application/vnd.vettalon.image-source.v1 \
            --annotation "org.opencontainers.image.description=Corresponding source of $REPO@$DIGEST" \
            --annotation "org.opencontainers.image.source=https://github.com/zhixuli0406/vettalon" \
            "$REPO@$DIGEST" \
            SOURCES.json:application/json \
            sources.tar:application/vnd.oci.image.layer.v1.tar > "$RUNNER_TEMP/attach.json"
          src=$(jq -r .digest "$RUNNER_TEMP/attach.json")
          [[ "$src" =~ ^sha256:[0-9a-f]{64}$ ]] || { cat "$RUNNER_TEMP/attach.json"; exit 1; }
          cosign sign --yes "$REPO@$src"
          now=$(oras manifest fetch --descriptor "$REPO:$TAG-source" 2>/dev/null | jq -r '.digest // empty' || true)
          if [[ -n "$now" && "$now" != "$STALE_SOURCE" ]]; then
            echo "::error::$TAG-source changed during this run; not overwriting"; exit 1
          fi
          oras tag "$REPO@$src" "$TAG-source"

      - name: Tag the image (last, so nothing is tagged without its source)
        if: steps.state.outputs.exists != 'true'
        env:
          REPO: ${{ steps.state.outputs.repo }}
          DIGEST: ${{ steps.signed.outputs.digest }}
        run: |
          set -euo pipefail
          if oras manifest fetch --descriptor "$REPO:$TAG" > /dev/null 2>&1; then
            echo "::error::$REPO:$TAG appeared during this run; not overwriting"; exit 1
          fi
          oras tag "$REPO@$DIGEST" "$TAG"
          echo "published $REPO:$TAG = $DIGEST"
          echo "- \`$REPO:$TAG\` = \`$DIGEST\` (source: \`$TAG-source\`)" >> "$GITHUB_STEP_SUMMARY"
