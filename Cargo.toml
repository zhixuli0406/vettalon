[workspace]
resolver = "2"
members = ["crates/vettalon-contract", "crates/vettalon"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
publish = false

[workspace.dependencies]
vettalon-contract = { path = "crates/vettalon-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
