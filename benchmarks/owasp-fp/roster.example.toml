# Config A: claude finds, codex (different family) verifies.
[[model]]
id = "claude"
backend = "cli"
preset = "claude"
roles = ["finder", "verifier"]
[[model]]
id = "codex"
backend = "cli"
preset = "codex"
allow_agent_tools = true   # OWASP cases are synthetic; production uses the container
roles = ["verifier"]

